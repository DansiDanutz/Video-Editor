<!DOCTYPE html>
<html lang="en" data-composition-variables="[
    {&quot;id&quot;:&quot;kicker&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Kicker&quot;,&quot;default&quot;:&quot;DID YOU KNOW?&quot;,&quot;maxLength&quot;:32},
    {&quot;id&quot;:&quot;question&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Question&quot;,&quot;default&quot;:&quot;Why does no country own Antarctica, even though seven claim it?&quot;,&quot;maxLength&quot;:160},
    {&quot;id&quot;:&quot;case_number&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Case number&quot;,&quot;default&quot;:&quot;CASE 001&quot;,&quot;maxLength&quot;:24}
  ]">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #06080d;
        --deep: #0d1422;
        --fog: #1b2638;
        --paper: #ece6d8;
        --muted: #7d8799;
        --amber: #f2b33d;
        --red: #d6453d;
        --amber-glow: color-mix(in srgb, var(--amber) 38%, transparent);
        --amber-soft: color-mix(in srgb, var(--amber) 55%, transparent);
        --q-size: 120px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }

      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
      #cam { position: absolute; inset: 0; transform-origin: 50% 50%; }

      #bg { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 75% at 50% 50%, var(--deep) 0%, var(--ink) 100%); }
      #grid {
        position: absolute; inset: 0; opacity: 0.35;
        background-image:
          linear-gradient(to right, var(--fog) 1px, transparent 1px),
          linear-gradient(to bottom, var(--fog) 1px, transparent 1px);
        background-size: 120px 120px;
        -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 0%, transparent 100%);
        mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 0%, transparent 100%);
      }
      #vignette {
        position: absolute; inset: -80px;
        background: radial-gradient(ellipse 60% 60% at 50% 50%, transparent 40%, var(--ink) 100%);
      }
      #grain {
        position: absolute; inset: 0; opacity: 0.07; mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
      }

      #labelrow { position: absolute; left: 120px; top: 96px; display: flex; align-items: center; gap: 28px; }
      #case {
        font-family: "IBM Plex Mono", monospace; font-weight: 700; font-size: 28px;
        letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);
      }
      #rule { width: 240px; height: 3px; background: var(--red); transform-origin: 0 50%; }

      #content {
        position: absolute; inset: 0; padding: 160px 200px;
        display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 36px;
      }
      #kicker {
        font-family: "IBM Plex Mono", monospace; font-weight: 700; font-size: 34px;
        letter-spacing: 0.18em; text-transform: uppercase; color: var(--amber); text-align: center;
      }
      #textblock { width: 1500px; max-width: 1500px; text-align: center; }
      #question {
        font-family: "League Gothic", sans-serif; font-weight: 400; text-transform: uppercase;
        font-size: var(--q-size); line-height: 0.95; letter-spacing: 0.01em; color: var(--paper);
      }
      .w { display: inline-block; white-space: nowrap; }
      .ch { position: relative; display: inline; }
      .c { opacity: 0; }
      .cur {
        position: absolute; left: 100%; top: 0.06em; width: 0.07em; height: 0.82em;
        margin-left: 0.04em; background: var(--amber); opacity: 0;
      }

      #qwrap { position: absolute; right: 170px; top: 50%; width: 360px; height: 520px; margin-top: -260px; }
      #qglow {
        position: absolute; inset: -140px; opacity: 0;
        background: radial-gradient(circle at 50% 50%, var(--amber-glow) 0%, transparent 65%);
      }
      #qmark {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font-family: "League Gothic", sans-serif; font-size: 520px; line-height: 1; color: var(--amber);
        text-shadow: 0 0 40px var(--amber-soft); opacity: 0;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-ohdm" id="stage" data-composition-id="main" data-start="0" data-duration="6" data-fps="30" data-width="1920" data-height="1080">
      <div data-hf-id="hf-ftaq" id="cam">
        <div data-hf-id="hf-2xc0" id="bg"></div>
        <div data-hf-id="hf-gs5t" id="grid"></div>
        <div data-hf-id="hf-h7i3" id="vignette"></div>
        <div data-hf-id="hf-f6d6" id="grain"></div>
        <div data-hf-id="hf-d69x" id="qwrap" aria-hidden="true" data-layout-allow-overlap="true">
          <div data-hf-id="hf-l0yl" id="qglow"></div>
          <div data-hf-id="hf-wqry" id="qmark" data-layout-allow-overlap="true">?</div>
        </div>
        <div data-hf-id="hf-lb60" id="content">
          <div data-hf-id="hf-p8ok" id="kicker" data-var-text="kicker">DID YOU KNOW?</div>
          <div data-hf-id="hf-m30z" id="textblock"><div data-hf-id="hf-wtht" id="question"></div></div>
        </div>
        <div data-hf-id="hf-m0mv" id="labelrow">
          <div data-hf-id="hf-t55t" id="case" data-var-text="case_number">CASE 001</div>
          <div data-hf-id="hf-8e4z" id="rule"></div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const DEFAULT_QUESTION = "Why does no country own Antarctica, even though seven claim it?";
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const questionText = String(vars.question || DEFAULT_QUESTION).trim();

      // Auto-fit by character count
      const n = questionText.length;
      const size = n <= 40 ? 150 : n <= 70 ? 120 : n <= 110 ? 100 : 88;
      document.documentElement.style.setProperty("--q-size", size + "px");

      // Build per-char spans once (words wrapped inline-block, spaces between)
      const qEl = document.getElementById("question");
      const chars = [];
      const makeCh = (text) => {
        const ch = document.createElement("span");
        ch.className = "ch";
        const c = document.createElement("span");
        c.className = "c";
        c.textContent = text;
        const cur = document.createElement("i");
        cur.className = "cur";
        ch.append(c, cur);
        chars.push({ c, cur });
        return ch;
      };
      questionText.split(/\s+/).forEach((word, wi, arr) => {
        const w = document.createElement("span");
        w.className = "w";
        Array.from(word).forEach((g) => w.appendChild(makeCh(g)));
        qEl.appendChild(w);
        if (wi < arr.length - 1) qEl.appendChild(makeCh(" "));
      });

      const TYPE_START = 0.9, TYPE_END = 3.6, HIT = 3.6, END = 6;
      const step = (TYPE_END - TYPE_START) / chars.length;

      const tl = gsap.timeline({ paused: true });

      // Beat 1: background, label row
      tl.fromTo("#bg", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);
      tl.fromTo("#grid", { opacity: 0 }, { opacity: 0.35, duration: 0.6, ease: "sine.out" }, 0);
      tl.fromTo("#case", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.15);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "expo.out" }, 0.25);
      tl.fromTo("#vignette", { scale: 1.08 }, { scale: 1, duration: END, ease: "none" }, 0);

      // Beat 2: kicker
      tl.fromTo("#kicker", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.4);

      // Beat 3: typewriter; cursor rides the latest char
      chars.forEach((o, i) => {
        const t = TYPE_START + i * step;
        tl.set(o.c, { opacity: 1 }, t);
        tl.set(o.cur, { opacity: 1 }, t);
        if (i < chars.length - 1) tl.set(o.cur, { opacity: 0 }, t + step);
      });
      // Blink on the final char, deterministic 0.5s period (finite)
      const lastCur = chars[chars.length - 1].cur;
      for (let t = TYPE_END, on = false; t < END; t += 0.45, on = !on) {
        tl.set(lastCur, { opacity: on ? 1 : 0 }, t);
      }

      // Beat 4: the "?" hit + 3-frame shake
      tl.fromTo("#qmark", { opacity: 0, scale: 0.55 }, { opacity: 0.22, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, HIT);
      tl.fromTo("#qglow", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" }, HIT);
      const F = 1 / 30;
      tl.set("#textblock", { x: 9 }, HIT)
        .set("#textblock", { x: -7 }, HIT + F)
        .set("#textblock", { x: 4 }, HIT + 2 * F)
        .set("#textblock", { x: 0 }, HIT + 3 * F);

      // Beat 5: slow glow pulse (finite)
      tl.to("#qglow", { opacity: 0.55, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, HIT + 0.6);
      tl.to("#qmark", { opacity: 0.32, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, HIT + 0.6);

      // Camera push-in over whole piece (inner wrapper, not a .clip)
      tl.fromTo("#cam", { scale: 1 }, { scale: 1.06, duration: END, ease: "none" }, 0);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
